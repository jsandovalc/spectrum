[project]
name = "spectrum"
version = "0.5.0"
description = "Stacked PR tool for GitHub"
requires-python = ">=3.11"
dependencies = ["click>=8.0"]

[project.scripts]
spectrum = "spectrum.cli:main"
sp = "spectrum.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
